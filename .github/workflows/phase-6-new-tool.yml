name: phase-6 new-tool

# Roadmap 6.1 — draft a rubric-aligned entry for a URL and upsert a tracking
# issue. Manual trigger only; advisory (continue-on-error on the tool step).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the candidate tool/resource'
        required: true
      section:
        description: 'Target section (e.g. "Orchestration Frameworks")'
        required: true
      rationale:
        description: 'Short reason this earns a place (optional)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  draft:
    name: new-tool (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/repo-agent is local-only automation and is not published to
      # this repository. Skip cleanly when it is absent; the steps below
      # still run if the tool is ever added.
      - name: Check for repo-agent
        id: tooling
        run: |
          if [ -f tools/repo-agent/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/repo-agent is not present in this repository (local-only automation); draft skipped."
          fi

      - name: Set up Python
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tools/repo-agent/pyproject.toml'

      - name: Install
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Draft + upsert tracking issue
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_AGENT_LOG_FILE: ${{ runner.temp }}/repo-agent.jsonl
        run: |
          repo-agent workflow new-tool \
            --url "${{ inputs.url }}" \
            --section "${{ inputs.section }}" \
            --rationale "${{ inputs.rationale }}" \
            --repo "${{ github.repository }}" \
            --open-issue

      - name: Upload observability log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: repo-agent-log-${{ github.run_id }}
          path: ${{ runner.temp }}/repo-agent.jsonl
          if-no-files-found: ignore
          retention-days: 90
