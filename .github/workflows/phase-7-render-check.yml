name: Phase 7 — Render check

on:
  pull_request:
    paths:
      - "README.md"
      - "RUBRIC.md"
      - "ANTI-PATTERNS.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "appendix/**"
      - "docs/**"
      - "tools/repo-agent/**"
      - ".github/workflows/phase-7-*.yml"

permissions:
  contents: read

jobs:
  render-check:
    name: repo-agent workflow render-site --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tools/repo-agent is local-only automation and is not published to
      # this repository. Skip cleanly when it is absent so content PRs are
      # not blocked; the steps below still run if the tool is ever added.
      - name: Check for repo-agent
        id: tooling
        run: |
          if [ -f tools/repo-agent/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/repo-agent is not present in this repository (local-only automation); render check skipped."
          fi

      - name: Set up Python
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo-agent
        if: steps.tooling.outputs.present == 'true'
        run: python -m pip install --quiet -e tools/repo-agent

      - name: Run render-site --check
        if: steps.tooling.outputs.present == 'true'
        # Advisory on first rollout — matches the Phase 4/5/6 pattern.
        continue-on-error: true
        run: python -m repo_agent workflow render-site --check
