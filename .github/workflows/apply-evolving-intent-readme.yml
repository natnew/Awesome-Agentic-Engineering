name: Apply evolving intent README update

on:
  push:
    branches:
      - add-evolving-intent-evaluation
    paths:
      - .github/workflows/apply-evolving-intent-readme.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: add-evolving-intent-evaluation
          fetch-depth: 0

      - name: Update catalogue files
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          section_start = readme.index("## 🧪 Evaluation & Safety")
          section_end = readme.index("## 🧠 Skills and Operating Principles", section_start)
          section = readme[section_start:section_end]
          section = section.replace(
              "_Last reviewed: April 2026._",
              "_Last reviewed: July 2026._",
              1,
          )

          marker = "| [τ-bench](https://github.com/sierra-research/tau-bench) | Tool-use + user-simulation benchmark measuring agent reliability and consistency across trials. | `[official]` · `[benchmark]` |"
          entry = "| [LLMs Get Lost in Evolving User Intent](https://github.com/microsoft/evolving-intent) | Evaluates whether models track changing user intent across multi-turn conversations with argument reveals, revisions, function switches, and combined transitions; supports GSM8K, BIRD-SQL, BrowseComp+, and SWE-bench Verified. | `[official]` · `[benchmark]` [paper](https://arxiv.org/abs/2607.20734) |"

          if entry not in section:
              if marker not in section:
                  raise RuntimeError("Could not find the τ-bench row in the Evaluation & Safety benchmarks table")
              section = section.replace(marker, marker + "\n" + entry, 1)

          readme = readme[:section_start] + section + readme[section_end:]
          readme_path.write_text(readme, encoding="utf-8")

          changelog = subprocess.check_output(
              ["git", "show", "origin/main:CHANGELOG.md"],
              text=True,
          )
          changelog_entry = "- **Added** LLMs Get Lost in Evolving User Intent to the Evaluation & Safety benchmarks for testing agents under incrementally revealed, revised, and redirected user intent."
          changelog_marker = "## [Unreleased]\n\n"
          if changelog_entry not in changelog:
              changelog = changelog.replace(
                  changelog_marker,
                  changelog_marker + changelog_entry + "\n",
                  1,
              )
          Path("CHANGELOG.md").write_text(changelog, encoding="utf-8")

          standalone = Path("resources/evaluation-and-safety/llms-get-lost-in-evolving-user-intent.md")
          if standalone.exists():
              standalone.unlink()

          Path(".github/workflows/apply-evolving-intent-readme.yml").unlink()

      - name: Commit revised PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: add evolving intent benchmark to README"
          git push origin HEAD:add-evolving-intent-evaluation
