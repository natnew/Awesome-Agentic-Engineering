name: phase-6 pr-review

# Roadmap 6.3 — advisory PR review assistant. Scores content PRs against the
# rubric and posts/updates a single rubric scorecard comment. Path-scoped to
# markdown changes. Advisory (continue-on-error at the tool step).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: pr-review (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/repo-agent is local-only automation and is not published to
      # this repository. Skip cleanly when it is absent so content PRs are
      # not blocked; the steps below still run if the tool is ever added.
      - name: Check for repo-agent
        id: tooling
        run: |
          if [ -f tools/repo-agent/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/repo-agent is not present in this repository (local-only automation); advisory review skipped."
          fi

      - name: Set up Python
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tools/repo-agent/pyproject.toml'

      - name: Install
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Post rubric review comment
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_AGENT_LOG_FILE: ${{ runner.temp }}/repo-agent.jsonl
        run: |
          repo-agent workflow review-pr \
            --pr "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --post

      - name: Upload observability log
        if: always() && steps.tooling.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: repo-agent-log-${{ github.run_id }}
          path: ${{ runner.temp }}/repo-agent.jsonl
          if-no-files-found: ignore
          retention-days: 90
