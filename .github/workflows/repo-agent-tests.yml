name: repo-agent tests

on:
  pull_request:
    paths:
      - 'tools/repo-agent/**'
      - '.github/workflows/repo-agent-tests.yml'
      - 'RUBRIC.md'
      - 'ANTI-PATTERNS.md'

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/repo-agent is local-only automation and is not published to
      # this repository. Skip cleanly when it is absent so content PRs are
      # not blocked; the steps below still run if the tool is ever added.
      - name: Check for repo-agent
        id: tooling
        run: |
          if [ -f tools/repo-agent/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/repo-agent is not present in this repository (local-only automation); tests skipped."
          fi

      - name: Set up Python
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tools/repo-agent/pyproject.toml'

      - name: Install
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.tooling.outputs.present == 'true'
        working-directory: tools/repo-agent
        continue-on-error: true
        run: pytest -q
